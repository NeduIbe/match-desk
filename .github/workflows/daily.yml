name: Daily update

on:
  schedule:
    - cron: "30 5,17 * * *"   # 06:30 and 18:30 Nigerian time
  workflow_dispatch:           # lets you press "Run workflow" by hand
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data and build predictions
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 update.py

      - name: Save the new data back to the repository
        run: |
          git config user.name "match-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data" && git push)

      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/*.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
